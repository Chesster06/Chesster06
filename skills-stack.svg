<g class="pill" style="animation-delay:.10s"><rect x="256" y="398" width="90" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.4" filter="url(#glow)"/><text x="301" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">VS CODE</text><rect class="trace" x="256" y="398" width="90" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250" style="animation-delay:.10s"/></g>
<g class="pill" style="animation-delay:.20s"><rect x="360" y="398" width="75" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.4" filter="url(#glow)"/><text x="397.5" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">XAMPP</text><rect class="trace" x="360" y="398" width="75" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250" style="animation-delay:.20s"/></g>
<g class="pill" style="animation-delay:.30s"><rect x="449" y="398" width="125" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.4" filter="url(#glow)"/><text x="511.5" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">PHPMYADMIN</text><rect class="trace" x="449" y="398" width="125" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250" style="animation-delay:.30s"/></g>
<g class="pill" style="animation-delay:.40s"><rect x="588" y="398" width="125" height="34" rx="9" fill="#180d2a" stroke="#7c3aed" stroke-width="1.4" filter="url(#glow)"/><text x="650.5" y="420" text-anchor="middle" class="pill-text" fill="#ddd6fe">ANTIGRAVITY</text><rect class="trace" x="588" y="398" width="125" height="34" rx="9" stroke="#7c3aed" stroke-dasharray="30 250" style="animation-delay:.40s"/></g>
</g>

