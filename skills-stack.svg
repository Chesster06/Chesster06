<rect x="410" y="256" width="80" height="1" fill="#dc2626" opacity="0.5"/>
<g>
<g class="pill" style="animation-delay:.05s"><rect x="240" y="278" width="95" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.4" filter="url(#glow)"/><text x="287.5" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">LARAVEL</text><rect class="trace" x="240" y="278" width="95" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250" style="animation-delay:.05s"/></g>
<g class="pill" style="animation-delay:.15s"><rect x="353" y="278" width="105" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.4" filter="url(#glow)"/><text x="405.5" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">BOOTSTRAP</text><rect class="trace" x="353" y="278" width="105" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250" style="animation-delay:.15s"/></g>
<g class="pill" style="animation-delay:.25s"><rect x="476" y="278" width="75" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.4" filter="url(#glow)"/><text x="513.5" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">MYSQL</text><rect class="trace" x="476" y="278" width="75" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250" style="animation-delay:.25s"/></g>
<g class="pill" style="animation-delay:.35s"><rect x="569" y="278" width="90" height="34" rx="9" fill="#2a0d0d" stroke="#dc2626" stroke-width="1.4" filter="url(#glow)"/><text x="614" y="300" text-anchor="middle" class="pill-text" fill="#fecaca">MARIADB</text><rect class="trace" x="569" y="278" width="90" height="34" rx="9" stroke="#dc2626" stroke-dasharray="30 250" style="animation-delay:.35s"/></g>
</g>

